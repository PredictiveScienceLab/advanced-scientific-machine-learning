<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Generic autoinjector components</title>
  <desc id="desc">Black-and-white conceptual cross-section of a generic autoinjector showing the activation button, spring, plunger, drug cartridge, needle, housing, and removable cap.</desc>
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#666" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="white"/>
  <rect x="85" y="80" width="650" height="120" rx="55" fill="white" stroke="#111" stroke-width="4"/>
  <rect x="735" y="95" width="105" height="90" rx="16" fill="url(#hatch)" stroke="#111" stroke-width="3"/>
  <line x1="735" y1="80" x2="735" y2="200" stroke="#111" stroke-width="3"/>
  <rect x="47" y="110" width="45" height="60" rx="12" fill="#ddd" stroke="#111" stroke-width="3"/>
  <path d="M115 140 q18 -33 36 0 q18 33 36 0 q18 -33 36 0 q18 33 36 0 q18 -33 36 0" fill="none" stroke="#111" stroke-width="4"/>
  <rect x="286" y="105" width="24" height="70" fill="#777" stroke="#111" stroke-width="2"/>
  <rect x="310" y="103" width="325" height="74" rx="10" fill="#eee" stroke="#111" stroke-width="3"/>
  <path d="M330 140 H610" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="635" y="119" width="45" height="42" fill="#bbb" stroke="#111" stroke-width="2"/>
  <line x1="680" y1="140" x2="790" y2="140" stroke="#111" stroke-width="4"/>
  <line x1="790" y1="140" x2="830" y2="140" stroke="#111" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#111" text-anchor="middle">
    <text x="69" y="55">Activation button</text>
    <text x="205" y="55">Spring</text>
    <text x="298" y="238">Plunger</text>
    <text x="472" y="238">Drug cartridge</text>
    <text x="700" y="55">Needle</text>
    <text x="788" y="238">Removable cap</text>
    <text x="420" y="28" font-weight="bold">Generic autoinjector (conceptual cross-section)</text>
    <text x="420" y="286" font-size="15">Not to scale; component geometry varies among devices.</text>
  </g>
  <g stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M69 62 V105"/>
    <path d="M205 62 V112"/>
    <path d="M298 220 V181"/>
    <path d="M472 220 V181"/>
    <path d="M700 62 V126"/>
    <path d="M788 220 V190"/>
  </g>
</svg>
