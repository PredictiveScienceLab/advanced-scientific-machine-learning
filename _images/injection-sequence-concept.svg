<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual autoinjector sequence</title>
  <desc id="desc">Three black-and-white panels show a generic autoinjector placed on skin, needle insertion into layered tissue, and drug delivery producing a schematic depot. The diagram is conceptual and contains no simulation results.</desc>
  <defs>
    <pattern id="fat" width="16" height="12" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#aaa"/><circle cx="12" cy="9" r="2" fill="#aaa"/>
    </pattern>
    <pattern id="muscle" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#888" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="white"/>
  <text x="480" y="28" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold">Conceptual injection sequence</text>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#111" text-anchor="middle">
    <text x="160" y="62" font-weight="bold">(a) Device placement</text>
    <text x="480" y="62" font-weight="bold">(b) Needle insertion</text>
    <text x="800" y="62" font-weight="bold">(c) Drug delivery</text>
  </g>
  <g stroke="#111" stroke-width="3">
    <rect x="105" y="80" width="110" height="105" rx="20" fill="#eee"/>
    <rect x="425" y="80" width="110" height="105" rx="20" fill="#eee"/>
    <rect x="745" y="80" width="110" height="105" rx="20" fill="#eee"/>
    <line x1="160" y1="185" x2="160" y2="198"/>
    <line x1="480" y1="185" x2="480" y2="285"/>
    <line x1="800" y1="185" x2="800" y2="285"/>
  </g>
  <g stroke="#111" stroke-width="2">
    <path d="M40 220 H280"/><path d="M360 220 H600"/><path d="M680 220 H920"/>
    <rect x="40" y="220" width="240" height="40" fill="#ddd"/>
    <rect x="360" y="220" width="240" height="40" fill="#ddd"/>
    <rect x="680" y="220" width="240" height="40" fill="#ddd"/>
    <rect x="40" y="260" width="240" height="75" fill="url(#fat)"/>
    <rect x="360" y="260" width="240" height="75" fill="url(#fat)"/>
    <rect x="680" y="260" width="240" height="75" fill="url(#fat)"/>
    <rect x="40" y="335" width="240" height="45" fill="url(#muscle)"/>
    <rect x="360" y="335" width="240" height="45" fill="url(#muscle)"/>
    <rect x="680" y="335" width="240" height="45" fill="url(#muscle)"/>
  </g>
  <path d="M800 288 C755 275 742 310 768 330 C790 348 825 344 842 322 C861 297 841 278 800 288 Z" fill="#bbb" stroke="#111" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M800 205 V273" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#111">
    <text x="48" y="246">Skin</text><text x="48" y="300">Subcutaneous tissue</text><text x="48" y="363">Muscle</text>
    <path d="M844 292 L870 252" fill="none" stroke="#111" stroke-width="1.5"/>
    <text x="883" y="235" text-anchor="middle">Schematic</text><text x="883" y="252" text-anchor="middle">drug depot</text>
  </g>
  <text x="480" y="414" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#111">Conceptual diagram only; no stress field or simulation values are shown.</text>
</svg>
